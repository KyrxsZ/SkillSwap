{% extends "base.html" %}{% block title %}Log In{% endblock %}{% block content %}<section class="form-page narrow"><div class="page-intro"><p class="eyebrow">Welcome back</p><h1>Log in to <em>SkillSwap.</em></h1><p>Keep your exchanges moving.</p></div><form class="form-card" method="post"><label>Student ID<input name="student_id" value="{{ form.get('student_id', '') }}" inputmode="numeric" pattern="[0-9]{11}" maxlength="11" required></label><label>Password<input type="password" name="password" required></label><button class="button primary" type="submit">Log in <span>→</span></button><p class="form-note">New to SkillSwap? <a href="{{ url_for('register') }}">Create an account</a>.</p></form></section>{% endblock %}
