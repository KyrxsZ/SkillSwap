{% extends "base.html" %}{% block title %}Add a Skill{% endblock %}{% block content %}<section class="form-page"><div class="page-intro"><p class="eyebrow">Put knowledge in motion</p><h1>Share what you <em>know.</em></h1><p>Give another student a head start. You might learn something unexpected in return.</p></div><form class="form-card" method="post" enctype="multipart/form-data"><div class="form-grid"><label>Skill title<input name="title" value="{{ form.get('title', '') }}" placeholder="e.g. Guitar" required></label><label>Category<select name="category" required><option value="">Choose a category</option>{% for category in ['Technology', 'Design', 'Creative', 'Languages', 'Business', 'Wellness', 'Other'] %}<option {% if form.get('category') == category %}selected{% endif %}>{{ category }}</option>{% endfor %}</select></label><label>What can you teach?<input name="teach" value="{{ form.get('teach', '') }}" placeholder="e.g. Chords and songwriting" required></label></div><label>Description<textarea name="description" rows="5" placeholder="Tell students what they will get from learning with you..." required>{{ form.get('description', '') }}</textarea></label><label>What do you want to learn?<input name="learn" value="{{ form.get('learn', '') }}" placeholder="e.g. Digital illustration" required></label><label class="upload-label">Portfolio image <span>Optional · JPG, PNG, GIF or WEBP · max 5MB</span><input id="portfolio_image" type="file" name="portfolio_image" accept="image/png,image/jpeg,image/gif,image/webp"><span class="file-name">No file chosen</span></label><button class="button primary" type="submit">Publish skill <span>→</span></button></form></section>{% endblock %}
