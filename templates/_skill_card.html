<article class="skill-card"><div class="card-top"><span class="category">{{ skill.category }}</span><span class="card-arrow">↗</span></div><h3>{{ skill.title }}</h3><p>{{ skill.description }}</p><div class="person"><span class="avatar">{{ skill.student_name[0] }}</span><span><strong>{{ skill.student_name }}</strong><small>Can teach {{ skill.teach }}</small></span></div><a class="card-link" href="{{ url_for('skill_detail', skill_id=skill.id) }}">View skill <span>→</span></a></article>
