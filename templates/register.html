{% extends "base.html" %}{% block title %}Register{% endblock %}{% block content %}<section class="form-page narrow"><div class="page-intro"><p class="eyebrow">Join the community</p><h1>Create your <em>account.</em></h1><p>Share what you know and find your next exchange.</p></div><form class="form-card" method="post"><label>Name<input name="name" value="{{ form.get('name', '') }}" autocomplete="name" required></label><label>Student ID<input name="student_id" value="{{ form.get('student_id', '') }}" inputmode="numeric" pattern="[0-9]{11}" maxlength="11" required></label><label>Password<input type="password" name="password" autocomplete="new-password" required></label><label>Confirm Password<input type="password" name="confirm_password" autocomplete="new-password" required></label><button class="button primary" type="submit">Register <span>→</span></button><p class="form-note">Already registered? <a href="{{ url_for('login') }}">Log in</a>.</p></form></section>{% endblock %}
